[project]
name = "m3u82vlc"
version = "0.1.7"
description = "Simple m3u8 stream detector with vlc backed playback&recording functionality"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloakbrowser>=0.5.11",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[tool.setuptools]
# Listed explicitly, as the local env.py would otherwise be discovered too
py-modules = ["main", "page", "server", "streams", "tunnel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
# env.py is gitignored, so ruff cannot detect it as first-party on its own
known-first-party = ["env"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
